name: Deploy proxy

# Optional (phase 9): deploys apps/proxy to Cloudflare Workers. Does nothing until the
# Cloudflare secrets below are set, so the repository works without a Cloudflare account.
on:
  push:
    branches: [main]
    paths: ['apps/proxy/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Settings > Secrets and variables > Actions > Secrets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_PROXY_TOKEN: ${{ secrets.GH_PROXY_TOKEN }}
    steps:
      - name: Check for Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GH_PROXY_TOKEN" ]; then
            echo "Cloudflare secrets not set; skipping the proxy deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.check.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.enabled == 'true'
        run: pnpm --filter @devcity/proxy test
      - if: steps.check.outputs.enabled == 'true'
        working-directory: apps/proxy
        run: |
          pnpm exec wrangler deploy
          echo "$GH_PROXY_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN
